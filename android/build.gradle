// The Gradle module React Native's autolinking picks up.
//
// It depends on the native SDK rather than vendoring a copy of it. That is the
// whole architecture in one line: `mobile/android` is the implementation, and
// this package is a bridge to it, so a fix to a root check reaches React Native
// apps by bumping one dependency rather than by porting the fix a second time.
// The iOS podspec beside it says the same thing about `mobile/ios`.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'io.fingerly.reactnative'
    compileSdk 36

    defaultConfig {
        // Matches the native SDK's floor. Raising it here would exclude apps
        // the SDK itself supports, and lowering it would promise a platform the
        // code does not build for.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Ahead of Fingerly's own repository, so that a contributor's local
        // build is found without that host having to answer.
        mavenLocal()
        // Where the native SDK, io.fingerly:fingerly, comes from.
        maven { url 'https://maven.fingerly.io' }
    }
}

dependencies {
    // Provided by the host application. A bridge that bundled its own copy of
    // React Native would give the app two.
    implementation 'com.facebook.react:react-android'

    // The SDK that does the collecting.
    //
    // Resolved from Fingerly's own Maven repository, declared above; see the
    // note in the package README. Contributors can instead publish the native
    // SDK to Maven Local (`./gradlew :fingerly:publishToMavenLocal` in
    // sdk-android), which the repositories above check first. A composite
    // build (`includeBuild` with a dependency substitution) does not work with
    // current React Native apps: they build with AGP 9 while the native SDK
    // builds with AGP 8, and Gradle refuses two AGP versions in one build.
    implementation 'io.fingerly:fingerly:0.2.0'
}
