// The Gradle module React Native's autolinking picks up.
//
// It depends on the native SDK rather than vendoring a copy of it. That is the
// whole architecture in one line: `mobile/android` is the implementation, and
// this package is a bridge to it, so a fix to a root check reaches React Native
// apps by bumping one dependency rather than by porting the fix a second time.
// The iOS podspec beside it says the same thing about `mobile/ios`.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'io.fingerly.reactnative'
    compileSdk 36

    defaultConfig {
        // Matches the native SDK's floor. Raising it here would exclude apps
        // the SDK itself supports, and lowering it would promise a platform the
        // code does not build for.
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url 'https://maven.fingerly.io' }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Ahead of Fingerly's own repository, so that a contributor's local
        // build is found without that host having to answer.
        mavenLocal()
        // Where the native SDK, io.fingerly:fingerly, comes from.
        maven { url 'https://maven.fingerly.io' }
    }
}

dependencies {
    // Provided by the host application. When compiled standalone for module
    // verification (rootProject == project), compile against REACT_NATIVE_VERSION
    // without bundling React Native into any AAR.
    if (rootProject == project) {
        def rnVersion = findProperty('REACT_NATIVE_VERSION') ?: '0.79.2'
        compileOnly "com.facebook.react:react-android:${rnVersion}"
    } else {
        implementation 'com.facebook.react:react-android'
    }

    // Core Android SDK (`v: 3`). Ships zero `<queries>` entries and zero Google
    // Play Services dependencies.
    implementation 'io.fingerly:fingerly:0.5.0'

    // Compile-only hooks for the opt-in artifacts (`io.fingerly:fingerly-app-checks`
    // and `io.fingerly:fingerly-play-integrity`). `compileOnly` never merges
    // `<queries>` or Play Services into the host APK unless the host app adds
    // those artifacts itself.
    compileOnly 'io.fingerly:fingerly-app-checks:0.5.0'
    compileOnly 'io.fingerly:fingerly-play-integrity:0.5.0'
}
